name: Release Please

# Keeps a release PR open that bumps the version and updates CHANGELOG.md from
# the conventional commits since the last release. Merging it tags the release,
# creates a draft GitHub release with the changelog as its notes, and builds
# the app into that draft.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so the
  # build is called directly rather than left to the tag push.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
