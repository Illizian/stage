name: Release

# Builds a universal macOS app and attaches it to a draft release. Release
# Please calls this when its release PR is merged; a v* tag pushed by hand
# also triggers it. Publish the draft by hand once you have checked the
# artifacts.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both halves of the universal binary.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      # An unset secret arrives as an empty string, not as an absent variable,
      # and an empty APPLE_CERTIFICATE makes the bundler try to import nothing
      # and fail the whole build. So each variable is exported only when it
      # actually has a value, which is also what lets an unsigned build work.
      - name: Prepare signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # put NAME VALUE - exports to later steps, tolerating multi-line values
          put() {
            {
              echo "$1<<__TAURI_EOF__"
              printf '%s\n' "$2"
              echo "__TAURI_EOF__"
            } >> "$GITHUB_ENV"
          }

          if [ -n "$CERT" ]; then
            # `base64` wraps its output by default on macOS and the decoder
            # will not accept line breaks, so normalise to a single line.
            put APPLE_CERTIFICATE "$(printf '%s' "$CERT" | tr -d '\n\r ')"
            put APPLE_CERTIFICATE_PASSWORD "$CERT_PASSWORD"
            [ -n "$IDENTITY" ] && put APPLE_SIGNING_IDENTITY "$IDENTITY"
            echo "Signing enabled."
          else
            echo "::warning::APPLE_CERTIFICATE is not set - this build will be unsigned."
          fi

          # Notarisation takes either an App Store Connect API key or an
          # Apple ID with an app-specific password. The API key is preferred
          # when both are present, but it needs API access to be enabled for
          # the team, which the Apple ID route does not.
          if [ -n "$API_KEY_P8" ]; then
            printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            chmod 600 "$RUNNER_TEMP/apple-api-key.p8"
            [ -n "$API_ISSUER" ] && put APPLE_API_ISSUER "$API_ISSUER"
            [ -n "$API_KEY" ] && put APPLE_API_KEY "$API_KEY"
            put APPLE_API_KEY_PATH "$RUNNER_TEMP/apple-api-key.p8"
            echo "Notarisation enabled, using an App Store Connect API key."
          elif [ -n "$APPLE_ID_EMAIL" ] && [ -n "$APPLE_ID_PASSWORD" ]; then
            put APPLE_ID "$APPLE_ID_EMAIL"
            put APPLE_PASSWORD "$APPLE_ID_PASSWORD"
            [ -n "$APPLE_TEAM" ] && put APPLE_TEAM_ID "$APPLE_TEAM"
            if [ -z "$APPLE_TEAM" ]; then
              echo "::warning::APPLE_TEAM_ID is not set; notarisation needs it when the Apple ID belongs to more than one team."
            fi
            echo "Notarisation enabled, using an Apple ID and app-specific password."
          else
            echo "::warning::No notarisation credentials - set either APPLE_API_KEY_P8 or APPLE_ID + APPLE_PASSWORD. The build will be signed but not notarised, and macOS will still warn on first launch."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          # Signing variables come from the step above, which exports only the
          # ones that are set. The CLI imports the certificate into a
          # temporary keychain itself.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Stage __VERSION__
          releaseBody: |
            A small git GUI that drives your own `git`.

            Download `Stage_______VERSION___universal.dmg` below, open it, and
            drag Stage to Applications.
          releaseDraft: true
          args: --target universal-apple-darwin
          tauriScript: bun run tauri

      # Says plainly in the log whether this build is actually distributable.
      - name: Check signature and notarisation
        if: always()
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Stage.app
          if [ ! -d "$APP" ]; then
            echo "No app bundle was produced."
            exit 0
          fi
          echo "--- codesign ---"
          codesign -dv --verbose=2 "$APP" 2>&1 || true
          echo "--- gatekeeper ---"
          if spctl -a -vvv -t install "$APP" 2>&1; then
            echo "Signed and notarised: this will open with a double-click."
          else
            echo "::warning::Not accepted by Gatekeeper. Users will have to allow it in System Settings > Privacy & Security."
          fi
